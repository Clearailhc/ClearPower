# Builds all three platforms on every push / PR, and publishes one GitHub Release with the
# Linux .deb, the macOS .dmg and the Windows installer + portable zip — either when a v* tag
# is pushed, or from a manual run with `release` ticked (which creates the tag itself).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for the version in VERSION"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: ./packaging/deb/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Swift Testing (`import Testing`) needs a Swift 6 toolchain; pick the newest Xcode on
      # the image rather than whatever the runner defaults to.
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - name: Test
        working-directory: macos
        run: swift test
      # make-dmg.sh renders the DMG background with Pillow, which is not on the image.
      - name: Install Pillow
        run: python3 -m pip install --break-system-packages --quiet pillow
      - name: Build app + DMG
        working-directory: macos
        run: |
          scripts/build-app.sh
          scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build, test, package
        shell: pwsh
        run: pwsh windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            windows/dist/*.exe
            windows/dist/*.zip

  # Runs for a pushed v* tag, and for a manual run with `release` ticked (which tags the
  # commit it builds as v<VERSION> itself).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and notes
        id: meta
        run: |
          (cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          NOTES="docs/RELEASE-${TAG}.md"
          if [ -f "$NOTES" ]; then echo "notes=$NOTES" >> "$GITHUB_OUTPUT"; else echo "notes=" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ClearPower ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes }}
          generate_release_notes: ${{ steps.meta.outputs.notes == '' }}
          files: artifacts/*
