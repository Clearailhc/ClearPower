name: windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "VERSION", ".github/workflows/windows.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["windows/**", "VERSION", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build, test, package
        shell: pwsh
        run: pwsh windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: clearpower-windows
          path: windows/dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/dist/ClearPower-Setup-*-x64.exe
            windows/dist/ClearPower-*-x64-portable.zip
            windows/dist/SHA256SUMS
